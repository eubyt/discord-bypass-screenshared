name: Build & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release version tag (e.g. v1.0.0)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Vet and Test
        run: |
          go vet ./...
          go test -v ./...

  build:
    name: Multiplatform Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build Binaries
        env:
          CGO_ENABLED: 0
        run: |
          mkdir -p build

          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o build/discord-tor-windows-amd64.exe .
          cp build/discord-tor-windows-amd64.exe build/discord-tor.exe
          GOOS=windows GOARCH=386 go build -ldflags="-s -w" -o build/discord-tor-windows-386.exe .

          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o build/discord-tor-darwin-arm64 .
          cp build/discord-tor-darwin-arm64 build/discord-tor
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o build/discord-tor-darwin-amd64 .

          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o build/discord-tor-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o build/discord-tor-linux-arm64 .

          cd build
          sha256sum * > SHA256SUMS.txt
          cd ..

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: discord-tor-builds
          path: build/*
          if-no-files-found: error

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "title=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          elif [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
            echo "title=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "title=Latest Build" >> $GITHUB_OUTPUT
          fi

      - name: Publish Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: ${{ steps.release_tag.outputs.title }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: build/*
